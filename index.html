<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitty — AI Calorie Counter</title>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: #1c1c1e;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
    h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .tagline { color: #6e6e73; margin-bottom: 40px; font-size: 18px; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    nav a {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid #e5e5ea;
      border-radius: 12px;
      color: #1c1c1e;
      text-decoration: none;
      font-weight: 600;
    }
    footer { margin-top: 56px; color: #6e6e73; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      body { color: #f2f2f7; background: #111113; }
      .tagline, footer { color: #98989e; }
      nav a { color: #f2f2f7; border-color: #2c2c2e; }
    }
  </style>
</head>
<body>
  <h1>Fitty</h1>
  <p class="tagline">AI calorie counter — snap a photo of your meal, get instant nutrition insights.</p>
  <nav>
    <a href="privacy/">Privacy Policy</a>
    <a href="support/">Support</a>
  </nav>
  <footer>© 2026 PIXELTIDE LLC. All rights reserved.</footer>
</body>
</html>
